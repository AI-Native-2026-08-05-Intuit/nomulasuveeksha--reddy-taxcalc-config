# taxcalc-api/pdb.yaml
# TASK 2: protect the floor. minAvailable matches the HPA
# minReplicas so a voluntary disruption (node drain, consolidation)
# never takes the service below two serving pods.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: taxcalc-api-pdb
  namespace: taxcalc-dev
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: taxcalc-api}
