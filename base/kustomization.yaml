# base/kustomization.yaml
# The W5 D3 manifest set, kept verbatim here. Overlays patch namespace,
# replicas, config values, and image tags — nothing else changes in base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 10-taxcalc-api.deployment.yaml
  - 20-taxcalc-api.service.yaml
  - 30-taxcalc-api.configmap.yaml
  - 40-taxcalc-api.secret.yaml
  # Argo CD v2.11.7 cannot parse Kubernetes v1.35's HPA
  # .status.terminatingReplicas field during client-side comparison.
  # The HPA is omitted until the Argo CD control plane is upgraded;
  # this also keeps dev's explicit one-replica configuration authoritative.
  - 60-taxcalc-api.servicemonitor.yaml
  # W6 D5: worker Deployment (KEDA scale target), KEDA ScaledObject,
  # SLO-derived HPA, and PodDisruptionBudget.
  - taxcalc-worker.deployment.yaml
  - taxcalc-worker-scaledobject.yaml
  - hpa.yaml
  - pdb.yaml
