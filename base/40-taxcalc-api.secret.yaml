apiVersion: v1
kind: Secret
metadata:
  name: taxcalc-api-secrets
  namespace: taxcalc-dev
  labels:
    app.kubernetes.io/name: taxcalc-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: taxcalc
    app.kubernetes.io/managed-by: argocd
type: Opaque
stringData:
  # W6 D3: these placeholders are replaced by External Secrets Operator
  # pulling from AWS Secrets Manager via IRSA. For now, provide dev-safe
  # dummy values so the pod can start against a local k3d cluster.
  SPRING_DATASOURCE_PASSWORD: replace-at-apply-time-from-secrets-manager
  mongo_password: replace-at-apply-time-from-secrets-manager
