---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taxcalc-api
  namespace: taxcalc-dev
  labels:
    app.kubernetes.io/name: taxcalc-api
    # CRITICAL: release label MUST be present — the Prometheus Operator's selector
    # is scoped to this label by default; missing it means the scrape never fires.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: taxcalc-api
  endpoints:
    - port: http            # Named container port (NOT a number)
      path: /actuator/prometheus
      interval: 15s
      metricRelabelings:
        # Drop high-cardinality exception labels to prevent metric explosion
        - action: labeldrop
          regex: 'exception'
