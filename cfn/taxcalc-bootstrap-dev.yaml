# cfn/taxcalc-bootstrap-dev.yaml
# TASK 1 baseline stack: the first CloudFormation stack the team
# ever deploys for this capstone. Creates a minimal S3 bucket plus
# the IAM role that GitHub Actions (W6 D1 OIDC) will assume to
# deploy ALL FUTURE CFN stacks in this capstone. The role's policy
# enumerates Action explicitly; Resource is scoped to the stack ARN
# pattern -- never Action: '*' / Resource: '*'.
#
# Deploy with the ChangeSet flow:
#   aws cloudformation create-change-set \
#     --stack-name taxcalc-bootstrap-dev \
#     --change-set-name initial --change-set-type CREATE \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --template-body file://cfn/taxcalc-bootstrap-dev.yaml \
#     --parameters ParameterKey=EnvName,ParameterValue=dev \
#     --region us-east-1
#   aws cloudformation describe-change-set ... # review
#   aws cloudformation execute-change-set ...
AWSTemplateFormatVersion: "2010-09-09"
Description: taxcalc bootstrap stack -- artefact bucket starter + CFN deploy role.

Parameters:
  EnvName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment.
  RetentionDays:
    # Parameterised value: dev keeps 30d of versions; prod keeps 365.
    Type: Number
    Default: 30
    MinValue: 7
    MaxValue: 3650
    Description: NoncurrentVersionExpiration in days (lifecycle rule).
  GitHubOrg:
    Type: String
    Default: AI-Native-2026-08-05-Intuit
    Description: GitHub org that hosts the W6 D1 OIDC role's repo.
  GitHubRepo:
    Type: String
    Default: nomulasuveeksha--reddy-taxcalc-config
    Description: Repo (the W6 D2 gitops config repo).
  ExistingBucketName:
    Type: String
    Default: uptimecrew-taxcalc-bootstrap-dev-276663280807
    Description: >-
      Name of the pre-existing S3 bucket to import into this stack.
      The sandbox account SCP denies s3:CreateBucket via CLI/CFN, so
      the bucket is created out-of-band from the console and imported
      via --change-set-type IMPORT rather than created by this template.

Resources:
  # --- The bootstrap bucket. Hardened from day 1: PAB on, default
  # KMS encryption (aws/s3 SSE-KMS), versioning on, lifecycle rule.
  # DeletionPolicy + UpdateReplacePolicy both Retain so a stack
  # delete / property-change replacement never destroys this bucket.
  BootstrapBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: "Access logging not required for the bootstrap bucket; adding it would create a circular logging dependency."
    Properties:
      # References the pre-existing bucket (created out-of-band from
      # the console before the SCP deny took effect). Imported via
      # --change-set-type IMPORT on the initial deploy.
      BucketName: !Ref ExistingBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: alias/aws/s3
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        # All four toggles. Anything less is wrong for an internal bucket.
        BlockPublicAcls:       true
        BlockPublicPolicy:     true
        IgnorePublicAcls:      true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref RetentionDays
      Tags:
        - {Key: Env,     Value: !Ref EnvName}
        - {Key: Project, Value: taxcalc}

  # --- Bucket policy: deny any request not using TLS.
  BootstrapBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BootstrapBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: "*"
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
            Resource:
              - !GetAtt BootstrapBucket.Arn
              - !Sub "${BootstrapBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # --- The CFN-deploy IAM role for GitHub Actions to assume.
  # Trust policy: OIDC federation, sub-claim pinned to the gitops
  # repo's main branch + PR workflow. NEVER a wildcard sub claim.
  CfnDeployRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit RoleName required: the OIDC trust policy sub claim and GitHub Actions assume-role reference both pin to this exact name."
          - id: W11
            reason: "cloudformation:ValidateTemplate is a global API that does not accept a resource ARN; Resource:* is required and the action is read-only."
    Properties:
      RoleName: taxcalc-api-cfn-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # StringEquals on aud: only sts.amazonaws.com is valid here.
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
              # StringLike on sub: Intuit's GitHub Enterprise appends numeric
              # entity IDs to org and repo names in the sub claim
              # (e.g. "repo:org@123/repo@456:pull_request" instead of
              # "repo:org/repo:pull_request"). The * after each name
              # matches those suffixes while keeping the match scoped
              # to this exact org and repo name prefix.
              StringLike:
                "token.actions.githubusercontent.com:sub":
                  - !Sub "repo:${GitHubOrg}*/${GitHubRepo}*:ref:refs/heads/main"
                  - !Sub "repo:${GitHubOrg}*/${GitHubRepo}*:pull_request"
      Policies:
        - PolicyName: cfn-deploy-narrow
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CFN stack + changeset operations: scoped to this capstone's stacks only.
              - Sid: CfnStackOps
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:DetectStackDrift
                  - cloudformation:DescribeStackDriftDetectionStatus
                  - cloudformation:DescribeStackResourceDrifts
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/taxcalc-*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/taxcalc-*"
              # ValidateTemplate is a global API - it does not target a specific
              # stack ARN, so it must be permitted on Resource: "*".
              - Sid: CfnValidateTemplate
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                Resource: "*"
              # S3 read on the bootstrap bucket (for stored templates).
              - Sid: BootstrapBucketRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt BootstrapBucket.Arn
                  - !Sub "${BootstrapBucket.Arn}/*"
              # IAM: only PassRole to roles the stacks themselves create.
              - Sid: PassStackRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/taxcalc-*"
      Tags:
        - {Key: Env,     Value: !Ref EnvName}
        - {Key: Project, Value: taxcalc}

Outputs:
  BootstrapBucketName:
    Description: Globally-unique bootstrap bucket name.
    Value: !Ref BootstrapBucket
    Export: {Name: !Sub "${AWS::StackName}-BucketName"}
  BootstrapBucketArn:
    Value: !GetAtt BootstrapBucket.Arn
    Export: {Name: !Sub "${AWS::StackName}-BucketArn"}
  CfnDeployRoleArn:
    Description: ARN the W6 D1 GitHub Actions workflow assumes via OIDC.
    Value: !GetAtt CfnDeployRole.Arn
    Export: {Name: !Sub "${AWS::StackName}-CfnDeployRoleArn"}
